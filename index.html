<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Protocol — Specifica aperta per workspace AI</title>
  <meta name="description" content="Dai al tuo agente AI un cervello strutturato. Specifica markdown-first, git-versioned, LLM-agnostica.">
  <meta property="og:title" content="Brain Protocol">
  <meta property="og:description" content="Specifica aperta per workspace AI strutturati. Markdown-first, human-readable, git-versioned.">
  <meta property="og:url" content="https://brainprotocol.it">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Rethink+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --negative: #e8e4df;
      --positive: #262c35;
      --positive-bold: #12151a;
      --positive-muted: #4c5159;
      --negative-muted: #d5d0cb;
      --accent: #4631e2;
      --accent-alt: #814bd1;
      --gradient: linear-gradient(270deg, #814bd1, #4631e2);
      --font-body: 'Rethink Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius-bevel: 15px 24px / 15px 24px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--negative);
      color: var(--positive);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 0;
    }
    a { color: var(--positive); text-decoration: none; }
    a:hover { color: var(--accent); }
    .container {
      max-width: 90vw;
      margin: 0 auto;
      border-left: 1px solid var(--positive);
      border-right: 1px solid var(--positive);
    }

    /* === TOP NAV === */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(232, 228, 223, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 48px;
      border-bottom: 1px solid var(--positive);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .nav-logo { font-weight: 500; font-size: 15px; letter-spacing: -0.02em; color: var(--positive-bold); }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: var(--positive-muted); }
    .nav-links a:hover { color: var(--positive-bold); }

    /* === AUDIENCE TOGGLE === */
    .toggle-group {
      display: flex;
      border: 1px solid var(--positive);
      border-radius: 111px;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .toggle-btn {
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      color: var(--positive-muted);
      border: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 11px;
      white-space: nowrap;
    }
    .toggle-btn.active {
      background: var(--positive);
      color: var(--negative);
    }
    .toggle-btn:not(.active):hover {
      background: var(--negative-muted);
    }

    /* === LANG TOGGLE === */
    .lang-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--positive);
      border-radius: 111px;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .lang-btn {
      padding: 5px 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--positive-muted);
      transition: background 0.2s, color 0.2s;
    }
    .lang-btn.active {
      background: var(--positive);
      color: var(--negative);
    }

    /* === MOBILE BOTTOM NAV === */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--negative);
      border-top: 1px solid var(--positive);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      font-family: var(--font-mono);
      font-size: 10px;
      backdrop-filter: blur(12px);
      background: rgba(232, 228, 223, 0.92);
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .bottom-nav a, .bottom-nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--positive-muted);
      text-decoration: none;
      border: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .bottom-nav a:hover, .bottom-nav button:hover { color: var(--accent); }
    .bottom-nav svg { width: 20px; height: 20px; }
    .bottom-nav .level-indicator {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 111px;
      background: var(--accent);
      color: #fff;
    }

    /* === BADGE === */
    .badge {
      display: inline-block;
      background: var(--positive);
      color: var(--negative);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 15px;
      border-radius: 111px;
    }

    /* === BUTTONS === */
    .btn {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 18px 32px;
      border: 1px solid var(--positive);
      background: var(--positive);
      color: var(--negative);
      border-radius: var(--radius-bevel);
      cursor: pointer;
      transition: border-radius 0.2s, background 0.2s, color 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      border-top-left-radius: 0; border-bottom-right-radius: 0;
      border-top-right-radius: 15px 24px; border-bottom-left-radius: 15px 24px;
      color: var(--negative);
    }
    .btn.outline { background: transparent; color: var(--positive); }
    .btn.outline:hover { background: var(--positive); color: var(--negative); }
    .btn.gradient { background: var(--gradient); border-color: var(--accent); color: #fff; }
    .btn.gradient:hover { border-color: var(--accent-alt); }

    /* === HERO === */
    .hero { padding: 72px 48px 80px; border-bottom: 1px solid var(--positive); }
    .hero .badge { margin-bottom: 32px; }
    .hero h1 {
      font-size: clamp(36px, 5vw, 66px); font-weight: 600; line-height: 1em;
      letter-spacing: -0.05em; color: var(--positive-bold); max-width: 800px; margin-bottom: 24px;
    }
    .hero .subtitle {
      font-size: 18px; color: var(--positive-muted); max-width: 560px;
      margin-bottom: 36px; line-height: 1.6;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 48px; }
    .pill {
      font-family: var(--font-mono); font-size: 12px; padding: 6px 14px;
      border: 1px solid var(--positive); border-radius: 111px; color: var(--positive-muted);
    }
    .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }

    /* === SECTIONS === */
    .section { border-bottom: 1px solid var(--positive); }
    .section-header { padding: 48px 48px 0; }
    .section-label {
      font-family: var(--font-mono); font-size: 12px; color: var(--positive-muted);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .section h2 {
      font-size: clamp(24px, 3vw, 36px); font-weight: 600;
      line-height: 1.1em; letter-spacing: -0.025em; color: var(--positive-bold);
    }

    .grid-split { display: grid; grid-template-columns: 3fr 2fr; }
    .grid-split > * { padding: 48px; }
    .grid-split > *:last-child { border-left: 1px solid var(--positive); }

    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .feature-card {
      padding: 24px; border-bottom: 1px solid var(--positive);
      border-right: 1px solid var(--positive);
    }
    .feature-card:nth-child(2n) { border-right: none; }
    .feature-card:nth-last-child(-n+2) { border-bottom: none; }
    .feature-card .icon { width: 32px; height: 32px; margin-bottom: 12px; color: var(--accent); }
    .feature-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .feature-card p { font-size: 14px; color: var(--positive-muted); line-height: 1.5; }

    .dir-tree { font-family: var(--font-mono); font-size: 14px; line-height: 2; }
    .dir-tree .dir-name { color: var(--positive-bold); font-weight: 500; }
    .dir-tree .dir-desc { color: var(--positive-muted); font-weight: 300; }

    .code-block {
      background: var(--positive-bold); color: var(--negative); font-family: var(--font-mono);
      font-size: 13px; line-height: 1.8; padding: 32px; border-radius: var(--radius-bevel); overflow-x: auto;
    }
    .code-block .key { color: #8ab9e2; }
    .code-block .string { color: #7de8b0; }
    .code-block .comment { color: #4c5159; }
    .code-block .bracket { color: #e8e4df; opacity: 0.5; }

    .steps-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .step { padding: 48px; border-right: 1px solid var(--positive); }
    .step:last-child { border-right: none; }
    .step-number {
      font-family: var(--font-mono); font-size: 48px; font-weight: 300;
      color: var(--accent); margin-bottom: 16px; line-height: 1;
    }
    .step h3 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .step p { font-size: 14px; color: var(--positive-muted); line-height: 1.6; }
    .step code {
      font-family: var(--font-mono); font-size: 12px;
      background: var(--negative-muted); padding: 2px 8px; border-radius: 4px;
    }

    .compat-section { padding: 48px; text-align: center; }
    .compat-grid {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-top: 32px; margin-bottom: 24px;
    }
    .compat-chip {
      font-family: var(--font-mono); font-size: 13px; padding: 10px 20px;
      border: 1px solid var(--positive); border-radius: var(--radius-bevel);
      transition: border-radius 0.2s, background 0.2s, color 0.2s;
    }
    .compat-chip:hover {
      background: var(--positive); color: var(--negative);
      border-top-left-radius: 0; border-bottom-right-radius: 0;
      border-top-right-radius: 15px 24px; border-bottom-left-radius: 15px 24px;
    }
    .compat-note { font-size: 14px; color: var(--positive-muted); }

    .users-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .user-card { padding: 48px; border-right: 1px solid var(--positive); }
    .user-card:last-child { border-right: none; }
    .user-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .user-card .user-type {
      font-family: var(--font-mono); font-size: 11px; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;
    }
    .user-card p { font-size: 14px; color: var(--positive-muted); line-height: 1.6; }

    .footer {
      display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 36px 48px;
      font-family: var(--font-mono); font-size: 12px; color: var(--positive-muted);
      border-bottom: 1px solid var(--positive);
    }
    .footer-center { text-align: center; }
    .footer-right { text-align: right; }
    .footer a { color: var(--positive-muted); }
    .footer a:hover { color: var(--positive-bold); }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      body { padding-bottom: 72px; }
      .container { max-width: 100vw; border: none; }
      .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(232, 228, 223, 0.92);
      backdrop-filter: blur(12px); padding: 16px 24px; }
      .nav-links .desktop-only { display: none; }
      .hero { padding: 48px 24px 56px; }
      .grid-split { grid-template-columns: 1fr; }
      .grid-split > *:last-child { border-left: none; border-top: 1px solid var(--positive); }
      .steps-grid { grid-template-columns: 1fr; }
      .step { border-right: none; border-bottom: 1px solid var(--positive); }
      .step:last-child { border-bottom: none; }
      .users-grid { grid-template-columns: 1fr; }
      .user-card { border-right: none; border-bottom: 1px solid var(--positive); }
      .user-card:last-child { border-bottom: none; }
      .feature-grid { grid-template-columns: 1fr; }
      .feature-card { border-right: none; }
      .footer { grid-template-columns: 1fr; gap: 12px; text-align: left; }
      .footer-center, .footer-right { text-align: left; }
      .section-header, .grid-split > *, .compat-section, .step, .user-card { padding: 32px 24px; }
      .bottom-nav { display: block; }
    }
  </style>
</head>

let currentLang = navigator.language.startsWith('it') ? 'it' : 'en';
let currentLevel = 'tech';

function render() {
  const t = T[currentLang][currentLevel];
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });

  // Dir tree
  const dirEl = document.getElementById('dir-tree');
  if (dirEl && t.dir) {
    dirEl.innerHTML = t.dir.map(([name, desc]) =>
      `<div><span class="dir-name">${name}</span> <span class="dir-desc">&mdash; ${desc}</span></div>`
    ).join('');
  }

  // Code block
  const codeEl = document.getElementById('code-example');
  if (codeEl && t.code) codeEl.innerHTML = t.code;

  // Active states
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.level === currentLevel);
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });

  // Mobile indicators
  const mi = document.getElementById('mobile-level');
  if (mi) mi.textContent = currentLevel === 'tech' ? 'PRO' : 'EASY';
  const ml = document.getElementById('mobile-lang');
  if (ml) ml.textContent = currentLang.toUpperCase();

  // Title
  document.title = currentLang === 'it'
    ? 'Brain Protocol \u2014 Specifica aperta per workspace AI'
    : 'Brain Protocol \u2014 Open specification for AI agent workspaces';

  document.documentElement.lang = currentLang;
}

function setLang(l) { currentLang = l; render(); }
function setLevel(l) { currentLevel = l; render(); }
function toggleLevel() { setLevel(currentLevel === 'tech' ? 'easy' : 'tech'); }
function toggleLang() { setLang(currentLang === 'it' ? 'en' : 'it'); }

render();
</script>
